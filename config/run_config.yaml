# ═══════════════════════════════════════════════════════════════════════
# Run Configuration
# ═══════════════════════════════════════════════════════════════════════
#
# Specify which planners to run on which environments.
#
# PLANNERS (case-insensitive, partial match):
#   RIT, GA (or GA-RRT), BIT, IRRT (or "Informed RRT"), AIT, EIT, APT,
#   CARM (or RIT-CARM)
#   "all" = every planner
#
# ENVIRONMENTS (case-insensitive, by dimension or name):
#   Dimensions: 2D, 3D, 6D           → all envs of that dimension
#               euclid / 2d_euclid   → all Euclidean-cost 2D envs
#   Names:      maze, narrow, forest, terrain, bug_trap, hyper_dense,
#               spheres, dense_lab, corridor, gauntlet,
#               hyper_passage, tabletop, shelf, cluttered,
#               diagonal_2d, obstacle,
#               obstacle_e, narrow_e, maze_e, forest_e  (Euclidean-cost)
#   "all" = every environment
#
# EXAMPLES:
#   planners: all
#   environments: all
#     → runs every planner on every environment
#
#   planners: [RIT]
#   environments: [2D]
#     → runs RIT* on all 2D environments
#
#   planners: [RIT, BIT]
#   environments: [2D, 3D]
#     → runs RIT* and BIT* on all 2D and 3D environments
#
#   planners: [RIT, BIT, AIT]
#   environments: [maze, narrow, spheres]
#     → runs those 3 planners on those 3 specific environments
#
# ═══════════════════════════════════════════════════════════════════════

# Paper benchmark: all planners on the 4 paper environments (Table II)
planners: ['RIT*', 'GA-RRT*', 'BIT*', 'Informed RRT*', 'AIT*', 'EIT*', 'APT*']
environments: ['2D Random World', '3D Diagonal', 'UR10_pick_place_drill', 'Tiago 14D simple']

# Benchmark parameters
timeout_seconds: 100
n_trials: 2
max_iterations: 200
batch_size: 100
base_seed: 60

# ── Output options ────────────────────────────────────────────────────
# save_image: save PNG/PDF plots of tree, path, and metric field
# save_gif:   save animated GIFs of tree growth
save_image: true
save_gif: true

# ── Benchmark (AIT*/EIT* style) ───────────────────────────────────────
# run_benchmark_plots: run the multi-trial data collection; if false
#                      neither plots nor tables will be generated.
# generate_benchmark_plots: generate Fig 6-style dual-panel plots
#                           (success rate + cost vs log-scale time)
# generate_benchmark_tables: generate Table II / III-style benchmark
#                            tables (CSV + LaTeX + console)
# bench parameters below are only used when run_benchmark_plots is true.
run_benchmark_plots: true
generate_benchmark_plots: true
generate_benchmark_tables: true
bench_timeout_seconds: 150
bench_cache_file: results/benchmark_data.pkl

# ── Monte Carlo comparison ───────────────────────────────────────────# run_mc: run the full Monte Carlo comparison pipeline
#         (generates CSV tables, convergence plots, box plots, etc.)run_mc: false
mc_n_trials: 10
mc_max_iterations: 150
mc_batch_size: 100
mc_base_seed: 42
mc_visualize: true

# ── Ablation study (paper Table tab:ablation) ─────────────────────────
# run_ablation : run RIT* vs (w/o Riem. samp. / cascading / CARM / smoothing)
#                across the four paper ablation envs and emit
#                  results/ablation.csv
#                  results/ablation_summary.csv
#                  results/ablation_table.tex   (paste-ready LaTeX)
# ablation_envs: list of env names (from ENV_REGISTRY). Default covers the
#                paper table: [2D Maze, 3D Spheres, 6D Shelf, 6D Cluttered].
run_ablation: true
ablation_n_trials: 10
ablation_max_iterations: 200
ablation_batch_size: 100
ablation_base_seed: 42
ablation_envs: ['2D Random World', '3D Diagonal', 'UR10_pick_place_drill', 'Tiago 14D simple']

# ── 6-D PyBullet demos (UR10e + Robotiq scenes, GUI-only) ─────────────
# Each entry launches the corresponding script as a sub-process. The
# script opens a PyBullet GUI, plans a path, animates it on loop. Close
# the window (or Ctrl+C) to advance to the next demo. Uncomment the ones
# you want to run — in listed order.
#
# Available 6-D demos:
#   UR10_grasp_can        : top-down grasp of a tomato-soup can next to
#                           a kraft-box wall obstacle.
#   UR10_pick_place_can   : pick the can on one side of the wall and
#                           place it on the other (over-wall demo).
#   UR10_pick_shelf       : side-grasp a mustard bottle from the upper
#                           compartment of a 2-shelf rack.
#   UR10_pick_place_shelf : starting from a grasped bottle (Phase 2),
#                           place it on top of the shelf.

run_pybullet_demos: false
pybullet_demos_gui: false     # set true to also open each demo in a GUI pass
pybullet_demos_save_gif: false # save visualization/gifs/pybullet_<demo>_<planner>.gif
pybullet_demos: ['Tiago 14D']
# pybullet_demos:
#   - UR10_grasp_can
#   - UR10_pick_place_can
#   - UR10_pick_shelf
#   - UR10_pick_place_shelf
#   - UR10_pick_place_drill

# ── Tiago Pro 14-D dual-arm demo ──────────────────────────────────────
# Plans both arms jointly in a 14-D configuration space using RIT*.
# Run interactively:  python Tiago_pro_dual_grasp_box.py
# Run headless:       python Tiago_pro_dual_grasp_box.py --headless
# Run full benchmark: add 'Tiago 14D' to environments: above
#                     (dimension tag '14d'; listed by `environments: [14d]`)
#
# Tiago 14D:
#   script : Tiago_pro_dual_grasp_box.py
#   planner: any (RIT*, BIT*, AIT*, APT*, Informed RRT*, EIT*)
#   scene  : Tiago Pro facing a tall box on a table, flanked by two red
#            obstacle boxes. Both 7-DOF arms reach inward from opposite
#            ends of the box; torso fixed at joint midpoint.
#   DOF    : 14  (arm_left_1…7 + arm_right_1…7)
tiago_demos:
  - name: Tiago 14D
    script: Tiago_pro_dual_grasp_box.py
    planner: RIT*
    dof: 14
    description: >
      Dual-arm bimanual pre-grasp of a tall box. Both 7-DOF arms are
      planned simultaneously in a 14-D C-space using RIT* with a
      diagonal inertia-weighted metric. Cross-arm self-collision is
      checked during planning. Two red obstacle boxes flank the central
      grasp target on the table.

