# ═══════════════════════════════════════════════════════════════════════
# Run Configuration
# ═══════════════════════════════════════════════════════════════════════
#
# Specify which planners to run on which environments.
#
# PLANNERS (case-insensitive, partial match):
#   RIT, BIT, IRRT (or "Informed RRT"), AIT, EIT, APT, CARM (or RIT-CARM)
#   "all" = every planner
#
# ENVIRONMENTS (case-insensitive, by dimension or name):
#   Dimensions: 2D, 3D, 6D           → all envs of that dimension
#               euclid / 2d_euclid   → all Euclidean-cost 2D envs
#   Names:      maze, narrow, forest, terrain, bug_trap, hyper_dense,
#               spheres, dense_lab, corridor, gauntlet,
#               hyper_passage, tabletop, shelf, cluttered,
#               diagonal_2d, obstacle,
#               obstacle_e, narrow_e, maze_e, forest_e  (Euclidean-cost)
#   "all" = every environment
#
# EXAMPLES:
#   planners: all
#   environments: all
#     → runs every planner on every environment
#
#   planners: [RIT]
#   environments: [2D]
#     → runs RIT* on all 2D environments
#
#   planners: [RIT, BIT]
#   environments: [2D, 3D]
#     → runs RIT* and BIT* on all 2D and 3D environments
#
#   planners: [RIT, BIT, AIT]
#   environments: [maze, narrow, spheres]
#     → runs those 3 planners on those 3 specific environments
#
#   planners: all
#   environments: [euclid]
#     → runs every planner on Euclidean-cost 2D envs (tight BIT* ellipses)
#
#   planners: all
#   environments: [2D, euclid]
#     → runs every planner on both Riemannian AND Euclidean 2D envs
#
#   planners: [RIT, BIT]
#   environments: [obstacle, obstacle_e]
#     → same obstacles, compare Riemannian vs Euclidean cost side by side
#random_world
# ═══════════════════════════════════════════════════════════════════════

#planners: all
#environments: [2D]

planners:      ['RIT*', 'Informed RRT*', 'BIT*', 'AIT*', 'EIT*', 'APT*']
environments:  ['random_world','dividing_wall']
#['random_world','dividing_wall']
#environments:  ['random_world','dividing_wall','2D Diagonal', '2D Obstacle', '2D Narrow', '2D Maze', '2D Bug Trap', '2D Forest', '2D Terrain', '2D Hyper-Dense', '2D Joint Arm']

# Benchmark parameters
n_trials: 5
max_iterations: 150
batch_size: 100
base_seed: 42

# ── Output options ────────────────────────────────────────────────────
# save_image: save PNG/PDF plots of tree, path, and metric field
# save_gif:   save animated GIFs of tree growth
save_image: true
save_gif: true

# ── Benchmark (AIT*/EIT* style) ───────────────────────────────────────
# run_benchmark_plots: run the multi-trial data collection; if false
#                      neither plots nor tables will be generated.
# generate_benchmark_plots: generate Fig 6-style dual-panel plots
#                           (success rate + cost vs log-scale time)
# generate_benchmark_tables: generate Table II / III-style benchmark
#                            tables (CSV + LaTeX + console)
# bench parameters below are only used when run_benchmark_plots is true.
run_benchmark_plots: true
generate_benchmark_plots: true
generate_benchmark_tables: true
bench_n_trials: 10
bench_max_iterations: 150
bench_batch_size: 100
bench_base_seed: 42

# ── Monte Carlo comparison ───────────────────────────────────────────
# run_mc: run the full Monte Carlo comparison pipeline
#         (generates CSV tables, convergence plots, box plots, etc.)
# mc parameters below are only used when run_mc is true.
run_mc: true
mc_n_trials: 10
mc_max_iterations: 150
mc_batch_size: 100
mc_base_seed: 42
mc_visualize: true
